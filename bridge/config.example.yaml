# ATR-EW bridge configuration. Copy to config.yaml and edit.
# Secrets are read from ENVIRONMENT VARIABLES named below — never put them in this file.

security:
  webhook_secret_env: WEBHOOK_SECRET      # must equal the "Webhook shared secret" input in the Pine script
  bridge_token_env: BRIDGE_TOKEN          # MT5 EA sends this in X-Bridge-Token (HTTP poll + execution reports)

network:
  # TradingView webhook source IPs (verify current list in TradingView docs before enabling).
  # Leave empty to disable the allowlist. If behind Cloudflare Tunnel / nginx, set trust_forwarded_for: true.
  allowed_ips: []
  # allowed_ips: [52.89.214.238, 34.212.75.30, 54.218.53.128, 52.32.178.7]
  trust_forwarded_for: false

# Canonical symbol -> TradingView aliases, pip size, price digits.
# The EA maps canonical -> broker symbol (suffixes like ".m", "GOLD" etc.) with its own InpSymbolMap input.
symbols:
  EURUSD: {aliases: ["OANDA:EURUSD", "FX:EURUSD", "FOREXCOM:EURUSD", "FX_IDC:EURUSD"], pip: 0.0001, digits: 5}
  GBPUSD: {aliases: ["OANDA:GBPUSD", "FX:GBPUSD", "FOREXCOM:GBPUSD", "FX_IDC:GBPUSD"], pip: 0.0001, digits: 5}
  USDJPY: {aliases: ["OANDA:USDJPY", "FX:USDJPY", "FOREXCOM:USDJPY", "FX_IDC:USDJPY"], pip: 0.01,   digits: 3}
  XAUUSD: {aliases: ["OANDA:XAUUSD", "FOREXCOM:XAUUSD", "TVC:GOLD", "GOLD"],             pip: 0.1,    digits: 2}

rules:
  max_age_seconds: 1200          # reject signals older than this (bar close -> now)
  max_per_day_total: 6           # bridge-wide cap on PASSED signals per UTC day
  max_per_day_per_symbol: 3
  min_rr_tp2: 1.5                # deterministic veto if TP2 is less than 1.5R
  max_risk_atr: 3.5              # deterministic veto if stop is wider than 3.5 ATR

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID               # channel/group for passed signals (e.g. -1001234567890)
  review_chat_id_env: TELEGRAM_REVIEW_CHAT_ID # optional private chat: vetoed signals for human review
  max_retries: 5
  timeout_seconds: 10

mt5:
  file_drop:
    enabled: true
    # MT5 "Common\Files" folder — shared by every terminal on this Windows machine.
    dir: "%APPDATA%/MetaQuotes/Terminal/Common/Files/ATR_EW/inbox"
    retention_hours: 48
  http_poll:
    enabled: true                # EA WebRequest needs the bridge reachable on port 80/443

ai:
  mode: shadow                   # off | shadow (score + log, never veto) | veto
  backend: ollama                # ollama | openai_compat  (llama.cpp llama-server, vLLM, LM Studio)
  base_url: http://127.0.0.1:11434   # llama-server default would be http://127.0.0.1:8080
  model: qwen2.5:7b-instruct-q4_K_M  # alternatives: llama3.1:8b-instruct-q4_K_M
  timeout_seconds: 20
  min_score: 55                  # veto threshold (veto mode only)
  temperature: 0.0

storage:
  sqlite_path: data/signals.db
